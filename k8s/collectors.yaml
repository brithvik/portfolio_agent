# ${app_image} is filled in by Terraform, so the version lives in one place.
# Every 5 minutes on weekdays 9 AM-4:55 PM ET. The collector itself skips when the market
# is closed (holidays, early closes), using Alpaca's market clock.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: snapshot
spec:
  schedule: "*/5 9-16 * * 1-5"
  timeZone: America/New_York   # market hours, correct through daylight saving changes
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: snapshot
              image: ${app_image}
              imagePullPolicy: IfNotPresent
              command: ["python", "collector.py", "snapshot"]
              envFrom:
                - secretRef:
                    name: alpaca-credentials
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: DATABASE_URL
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { memory: 96Mi, cpu: 50m }
                limits: { memory: 384Mi }
---
# News about your holdings, once an hour. Articles already saved are skipped.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: news
spec:
  schedule: "10 * * * *"
  timeZone: America/New_York   # market hours, correct through daylight saving changes
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3

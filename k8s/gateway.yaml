# ${app_image} is filled in by Terraform, so the version lives in one place.
#
# The broker gateway: the ONLY workload that receives the brokerage keys.
# The trading limits live here in plain sight, in version control, so every change to them
# shows up in a code review. The agent cannot change them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-limits
data:
  MAX_TRADE_DOLLARS: "2000"
  MIN_TRADE_DOLLARS: "5"
  MAX_DAILY_DOLLARS: "5000"
  MAX_TRADES_PER_DAY: "5"
  MAX_POSITION_PCT: "25"
  MIN_CASH_PCT: "5"
  MAX_PENDING: "3"
  PROPOSAL_TTL_MINUTES: "120"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate      # never two gateways at once: one place decides, one place orders
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      automountServiceAccountToken: false   # no access to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: gateway
          image: ${app_image}
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "gateway:app", "--host", "0.0.0.0", "--port", "8080"]
          envFrom:
            - configMapRef:
                name: gateway-limits
            - secretRef:
                name: alpaca-credentials
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: DATABASE_URL }
            - name: GATEWAY_AGENT_TOKEN
              valueFrom:
                secretKeyRef: { name: gateway-agent-token, key: token }
            - name: GATEWAY_APPROVER_TOKEN
              valueFrom:
                secretKeyRef: { name: gateway-approver-token, key: token }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8080

                      name: postgres-credentials
                      key: DATABASE_URL
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { memory: 96Mi, cpu: 50m }
                limits: { memory: 384Mi }
---
# Labels the news events behind today's candidates (classify.py), then records the day's
# ideas in the ledger (ledger.py), weekdays at 7:15 PM, after the market-data job. It carries the "agent" label on purpose: this is the one job in
# the idea engine that talks to the model, so it gets the agent's network rules (the database,
# and Gemini through the allowlisting proxy) and, like the agent, no Alpaca keys.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: classify-events
spec:
  schedule: "15 19 * * 1-5"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 7200
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: agent
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          initContainers:
            # Waits until this pod's network rules are in force, then exits (netgate.py). Fails closed.
            - name: netgate
              image: ${app_image}
              imagePullPolicy: IfNotPresent
              command: ["python", "netgate.py"]
              env:
                - { name: NETGATE_REQUIRE, value: "postgres:5432,egress-proxy:3128" }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { memory: 16Mi, cpu: 10m }
                limits: { memory: 64Mi }
          containers:
            - name: classify-events
              image: ${app_image}
              imagePullPolicy: IfNotPresent
              command: ["python", "ledger.py", "daily"]   # label, review, record ideas, print the scoreboard
              envFrom:
                - secretRef:
                    name: gemini-credentials
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: DATABASE_URL
                - name: HTTPS_PROXY
                  value: http://egress-proxy:3128
                - name: NO_PROXY
                  value: postgres,gateway,localhost,127.0.0.1,.svc,.cluster.local
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { memory: 128Mi, cpu: 50m }
                limits: { memory: 384Mi }
